name: Worker regression tests
on:
  pull_request:
    paths: ['worker/**', 'tools/security/**', '.github/workflows/worker-tests.yml']
  push:
    branches: [main]
    paths: ['worker/**', 'tools/security/**', '.github/workflows/worker-tests.yml']
jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tools/security/*.test.mjs
