<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My account | Mindlap</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/webp" href="/assets/favicon.webp">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/index.css?v=129">
    <link rel="stylesheet" href="/book/book.css?v=9">
</head>

<body class="book-page" data-page="account">

    <header class="book-topbar">
        <div class="book-topbar-inner">
            <a href="/" class="book-topbar-logo"><img src="/assets/logo.webp" alt="Mindlap" width="127" height="38"></a>
            <nav class="book-topbar-links">
                <a href="https://wa.me/917594000774?text=Hello%20Mindlap%2C%20I%20would%20like%20to%20book%20a%20therapy%20session." target="_blank" rel="noopener"><span class="hide-sm">Need help?</span> WhatsApp us</a>
                <a href="/">Back to site</a>
            </nav>
        </div>
    </header>

    <div class="book-shell solo">
        <main class="book-main">
            <div class="book-card account-card">
                <div class="account-head">
                    <div>
                        <h1 class="book-title" id="account-greeting">Hi there</h1>
                        <p class="book-lead">Book a session whenever you're ready.</p>
                    </div>
                    <div class="account-actions">
                        <a class="btn btn-primary" href="/#therapists">Book</a>
                        <button type="button" class="btn btn-secondary" id="account-logout">Log out</button>
                    </div>
                </div>

                <div class="account-credits account-wallet" id="account-wallet" hidden>
                    <span class="account-credits-num" data-wallet></span>
                    <span class="account-credits-text"><strong>Package balance</strong>Used for your sessions at your package price.</span>
                </div>

                <div class="account-credits" id="account-credits" hidden>
                    <span class="account-credits-num" data-credits></span>
                    <span class="account-credits-text"><strong data-credits-label>prepaid sessions left</strong>No payment needed when you book these.</span>
                </div>

                <div class="account-tabs" id="account-tabs" role="tablist" hidden>
                    <button type="button" role="tab" data-tab="upcoming">Upcoming <span class="count">0</span></button>
                    <button type="button" role="tab" data-tab="past">Past <span class="count">0</span></button>
                    <button type="button" role="tab" data-tab="all">All <span class="count">0</span></button>
                </div>

                <div id="account-sessions" class="account-sessions">
                    <p class="booking-slots-loading">Loading your sessions…</p>
                </div>
            </div>
        </main>
    </div>

    <script src="/book/book.js?v=18"></script>
</body>

</html>
