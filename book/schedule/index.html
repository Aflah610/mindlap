<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pick a time | Book Online | Mindlap</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/webp" href="/assets/favicon.webp">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/index.css?v=129">
    <link rel="stylesheet" href="/book/book.css?v=23">
</head>

<body class="book-page verify-page plan-choice-page schedule-choice-page" data-page="schedule">

    <header class="book-topbar">
        <div class="book-topbar-inner">
            <a href="/" class="book-topbar-logo"><img src="/assets/logo.webp" alt="Mindlap" width="127" height="38"></a>
            <nav class="book-topbar-links" aria-label="Page navigation">
                <a class="verify-back" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg>Back to site</a>
            </nav>
        </div>
    </header>

        <main class="book-main plan-choice-main schedule-choice-main">
            <a class="book-back" href="/book/plan/" id="schedule-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>Back</a>
            <div class="plan-content schedule-content">
                <h1 class="book-title">Choose a date and time</h1>
                <div class="schedule-session" id="schedule-with">All sessions are online.</div>
    
                <div class="modal-cta-box" id="credit-banner" hidden>
                    <p>Booking with your prepaid sessions (<strong data-credits></strong> left). No payment needed.</p>
                </div>
    
                <section class="pick-block" id="date-block" aria-labelledby="pick-date">
                    <h2 class="pick-label" id="pick-date"><span class="pick-num">1</span>Date<small id="date-month"></small></h2>
                    <div class="selected-date" id="selected-date" hidden>
                        <span class="selected-date-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6m10-6v6M3 11h18"/></svg></span>
                        <span><small>Selected date</small><strong id="selected-date-label"></strong></span>
                        <button type="button" id="change-date" aria-controls="date-strip" aria-expanded="false">Change date</button>
                    </div>
                    <div class="date-strip" id="date-strip" role="radiogroup" aria-labelledby="pick-date"><p class="booking-slots-loading">Loading dates…</p></div>
                </section>
    
                <section class="pick-block" id="time-block" aria-labelledby="pick-time" hidden>
                    <h2 class="pick-label" id="pick-time"><span class="pick-num">2</span>Time<small>India time (IST)</small></h2>
                    <div class="slot-groups" id="booking-slots"></div>
                </section>
    
    
                <p id="schedule-status" class="booking-status" role="status"></p>
    
                <div class="step-footer">
                    <div class="step-footer-summary" id="schedule-summary">Pick a date to see open times.</div>
                    <button type="button" id="schedule-next" class="btn btn-primary btn-lg" disabled>Continue</button>
                </div>
            </div>
        </main>

    <script src="/book/book.js?v=46"></script>
</body>

</html>
