<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Choose a plan | Book Online | Mindlap</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/webp" href="/assets/favicon.webp">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/index.css?v=168">
    <link rel="stylesheet" href="/book/book.css?v=26">
</head>

<body class="book-page verify-page plan-choice-page" data-page="plan">

    <header class="book-topbar">
        <div class="book-topbar-inner">
            <a href="/" class="book-topbar-logo"><img src="/assets/logo.webp" alt="Mindlap" width="127" height="38"></a>
            <nav class="book-topbar-links" aria-label="Page navigation">
                <a class="verify-back" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg>Back to site</a>
            </nav>
        </div>
    </header>

        <main class="book-main plan-choice-main">
            <a class="book-back" href="/book/session-type/" id="plan-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>Back</a>
            <div class="plan-content">
                <h1 class="book-title">Choose a plan</h1>
                <p class="book-lead" id="plan-with">All sessions are online.</p>

                <div class="modal-cta-box" id="credit-banner" hidden>
                    <p>Booking with your prepaid sessions (<strong data-credits></strong> left). No payment needed.</p>
                </div>

                <div class="plan-list" id="plan-list" role="radiogroup" aria-label="Plans">
                    <p class="booking-slots-loading">Loading plans…</p>
                </div>

                <p id="plan-status" class="booking-status" role="status"></p>

                <div class="step-footer">
                    <div class="step-footer-summary" id="plan-summary">Choose a plan</div>
                    <button type="button" id="plan-next" class="btn btn-primary btn-lg" disabled>Continue</button>
                </div>
            </div>
        </main>

    <script src="/book/book.js?v=50"></script>
</body>

</html>
