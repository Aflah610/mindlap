<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify your number | Book Online | Mindlap</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/webp" href="/assets/favicon.webp">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/index.css?v=129">
    <link rel="stylesheet" href="/book/book.css?v=15">
    <script>
        // Already logged in: hide the number form before it paints; book.js moves on to the next step.
        try {
            var t = (JSON.parse(localStorage.getItem('mindlapAuth')) || {}).token || '';
            var p = t.split('.')[0].replace(/-/g, '+').replace(/_/g, '/');
            if (p && JSON.parse(atob(p + '==='.slice((p.length + 3) % 4))).exp > Date.now() + 60000) {
                document.documentElement.classList.add('auth-skip');
            }
        } catch (e) { /* show the form */ }
    </script>
</head>

<body class="book-page verify-page" data-page="verify">
    <header class="book-topbar">
        <div class="book-topbar-inner">
            <a href="/" class="book-topbar-logo"><img src="/assets/logo.webp" alt="Mindlap" width="127" height="38"></a>
            <nav class="book-topbar-links" aria-label="Page navigation">
                <a class="verify-back" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg>Back to site</a>
            </nav>
        </div>
    </header>

    <main class="book-main verify-main">
        <div class="book-card">
            <div class="verify-illustration" aria-hidden="true">
                <svg viewBox="0 0 120 120" fill="none">
                    <circle cx="58" cy="62" r="53" fill="#F1FAF5"/>
                    <path d="m102 22 6-10m1 23 11-4m-10 16 10 3" stroke="#B8B8ED" stroke-width="3.5" stroke-linecap="round"/>
                    <path d="M58 33a28 28 0 0 0-24 42l-4 16 16-4a28 28 0 1 0 12-54Z" fill="#5CCF72"/>
                    <path d="M47 46c-2-1-5 3-5 6 0 9 14 23 23 23 3 0 7-4 6-6l-7-4c-1 0-3 4-5 3-5-2-10-7-12-12-1-2 3-4 3-5l-3-5Z" fill="white"/>
                </svg>
            </div>
            <div class="verify-code-banner" id="otp-code-banner" role="status" hidden>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 11.5a8 8 0 0 1-12 7L3 20l1.5-5A8 8 0 1 1 20 11.5Z"/><path d="M8 7c-2 2 4 8 6 6l1-1-3-2-1 1-2-2 1-1-2-2Z" fill="currentColor" stroke="none"/></svg>
                <span>Code sent via WhatsApp</span>
            </div>
            <h1 class="book-title">Let’s get you started</h1>
            <p class="book-lead">Enter your WhatsApp number to receive<br class="verify-desktop-break"> a verification code.</p>

            <div class="book-stack" id="otp-phone-step">
                <div id="otp-name-field" hidden><label for="otp-name">Your name</label><input type="text" id="otp-name" maxlength="60" autocomplete="name"></div>
                <div class="verify-phone">
                    <label class="verify-sr-only" for="otp-phone">WhatsApp number</label>
                    <div class="verify-country">
                        <svg id="otp-india-flag" class="verify-flag" viewBox="0 0 30 20" aria-hidden="true"><path fill="#FF9933" d="M0 0h30v7H0z"/><path fill="#fff" d="M0 7h30v6H0z"/><path fill="#138808" d="M0 13h30v7H0z"/><circle cx="15" cy="10" r="2.5" fill="none" stroke="#000080" stroke-width=".7"/><path d="M15 7.5v5m-2.5-2.5h5m-4.3-1.8 3.6 3.6m-3.6 0 3.6-3.6" stroke="#000080" stroke-width=".45"/></svg><span id="otp-country-display" aria-hidden="true">+91</span>
                        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
                        <select id="otp-country" class="phone-input-prefix" aria-label="Country code">
                                <option value="+91" selected>&#127470;&#127475; +91 India</option>
                                <option value="+971">&#127462;&#127466; +971 UAE</option>
                                <option value="+966">&#127480;&#127462; +966 Saudi Arabia</option>
                                <option value="+974">&#127478;&#127462; +974 Qatar</option>
                                <option value="+968">&#127476;&#127474; +968 Oman</option>
                                <option value="+965">&#127472;&#127484; +965 Kuwait</option>
                                <option value="+973">&#127463;&#127469; +973 Bahrain</option>
                                <option value="+1">&#127482;&#127480; +1 USA / Canada</option>
                                <option value="+44">&#127468;&#127463; +44 UK</option>
                                <option value="+61">&#127462;&#127482; +61 Australia</option>
                                <option value="+64">&#127475;&#127487; +64 New Zealand</option>
                                <option value="+65">&#127480;&#127468; +65 Singapore</option>
                                <option value="+60">&#127474;&#127486; +60 Malaysia</option>
                                <option value="+49">&#127465;&#127466; +49 Germany</option>
                                <option value="+353">&#127470;&#127466; +353 Ireland</option>
                                <option value="+94">&#127473;&#127472; +94 Sri Lanka</option>
                                <option value="+977">&#127475;&#127477; +977 Nepal</option>
                                <option value="+880">&#127463;&#127465; +880 Bangladesh</option>
                            </select>
                    </div>
                    <input type="tel" id="otp-phone" inputmode="tel" maxlength="14" placeholder="Enter your WhatsApp number" autocomplete="tel-national" aria-describedby="otp-status">
                </div>
                <button type="button" id="otp-send-btn" class="btn btn-primary btn-lg verify-send"><span>Send code on WhatsApp</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 12h16m-7-7 7 7-7 7"/></svg></button>
            </div>

            <div class="book-stack" id="otp-code-step" hidden>
                <p class="verify-code-lead"><label for="otp-code">Enter the 6-digit code sent to WhatsApp on <strong id="otp-sent-to"></strong>.</label> <button type="button" id="otp-change-btn" class="verify-change">Change</button></p>
                <div class="otp-code-control">
                    <div class="otp-digit-boxes" aria-hidden="true">
                        <span class="otp-digit"></span><span class="otp-digit"></span><span class="otp-digit"></span><span class="otp-digit"></span><span class="otp-digit"></span><span class="otp-digit"></span>
                    </div>
                    <input type="text" id="otp-code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code" aria-describedby="otp-status" spellcheck="false">
                </div>
                <p class="verify-resend-line">Didn’t receive a code? <button type="button" id="otp-resend-btn" class="otp-resend">Resend code</button></p>
                <button type="button" id="otp-verify-btn" class="btn btn-primary btn-lg verify-send" disabled>Verify and continue</button>
            </div>
            <p class="otp-continuing" id="otp-continuing"><span class="otp-spinner" aria-hidden="true"></span><span>Welcome back<span id="otp-continuing-phone"></span>. Taking you to the next step…</span></p>
            <p id="otp-status" class="booking-status" role="status" aria-live="polite"></p>
        </div>
    </main>

    <span class="verify-orb" aria-hidden="true"></span>
    <svg class="verify-waves" viewBox="0 0 800 320" preserveAspectRatio="none" fill="none" aria-hidden="true">
        <path d="M0 30C130-12 224 158 360 218S620 277 800 156V320H0Z" fill="#F5F4FA"/>
        <path d="M0 145C164 123 229 288 430 190S657 104 800 161V320H0Z" fill="#F8F7FC"/>
        <path d="M0 140C199 104 310 294 535 288S687 266 800 308V320H0Z" fill="#EEECF6" fill-opacity=".85"/>
        <path d="M0 319C180 259 292 264 440 302S694 335 800 310V320H0Z" fill="#FFFCF8"/>
        <path d="M495 320C631 261 700 144 800 76" stroke="#B8B5D8" stroke-width="2"/>

    </svg>
    <script src="/book/book.js?v=40"></script>
</body>

</html>
