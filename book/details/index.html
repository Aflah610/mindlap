<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your details | Book Online | Mindlap</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/webp" href="/assets/favicon.webp">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/index.css?v=126">
    <link rel="stylesheet" href="/book/book.css?v=1">
</head>

<body class="book-page" data-page="details">

    <header class="book-topbar">
        <div class="book-topbar-inner">
            <a href="/" class="book-topbar-logo"><img src="/assets/logo.webp" alt="Mindlap" width="127" height="38"></a>
            <nav class="book-topbar-links">
                <a href="https://wa.me/917594000774?text=Hello%20Mindlap%2C%20I%20would%20like%20to%20book%20a%20therapy%20session." target="_blank" rel="noopener"><span class="hide-sm">Need help?</span> WhatsApp us</a>
                <a href="/">Back to site</a>
            </nav>
        </div>
    </header>

    <ol class="book-stepper" id="book-stepper" aria-label="Booking progress"></ol>

    <main class="book-main">
        <a class="book-back" href="/book/schedule/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>Back</a>
        <div class="book-card">
            <h1 class="book-title">Your details</h1>
            <p class="book-lead">For <strong id="details-when"></strong>. We'll email your confirmation and session link.</p>

            <form id="details-form" class="booking-form" novalidate>
                <div class="booking-field">
                    <label for="details-name">Full name</label>
                    <input type="text" id="details-name" autocomplete="name" required>
                </div>

                <div class="booking-field">
                    <label for="details-email">Email address</label>
                    <input type="email" id="details-email" autocomplete="email" required>
                </div>

                <div class="booking-field">
                    <label for="details-phone">Verified WhatsApp number</label>
                    <input type="tel" id="details-phone" readonly>
                    <button type="button" id="details-change-number" class="otp-resend">Use a different number</button>
                </div>

                <div class="booking-field">
                    <label for="details-notes">Notes (optional)</label>
                    <textarea id="details-notes" rows="3" placeholder="Anything you'd like your therapist to know beforehand"></textarea>
                </div>

                <div class="booking-honeypot" aria-hidden="true">
                    <label for="details-hp">Leave this field blank</label>
                    <input type="text" id="details-hp" tabindex="-1" autocomplete="off">
                </div>

                <p id="details-status" class="booking-status" role="status"></p>

                <div class="book-actions">
                    <button type="submit" class="btn btn-primary btn-lg">Review booking</button>
                </div>
            </form>
        </div>
        <p class="book-help">Prefer to chat? <a href="https://wa.me/917594000774?text=Hello%20Mindlap%2C%20I%20would%20like%20to%20book%20a%20therapy%20session." target="_blank" rel="noopener">Book on WhatsApp</a></p>
    </main>

    <script src="/book/book.js?v=1"></script>
</body>

</html>
