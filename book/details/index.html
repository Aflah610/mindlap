<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your details | Book Online | Mindlap</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/webp" href="/assets/favicon.webp">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/index.css?v=129">
    <link rel="stylesheet" href="/book/book.css?v=24">
</head>

<body class="book-page verify-page plan-choice-page details-choice-page" data-page="details">
    <header class="book-topbar"><div class="book-topbar-inner">
        <a href="/" class="book-topbar-logo"><img src="/assets/logo.webp" alt="Mindlap" width="127" height="38"></a>
        <nav class="book-topbar-links" aria-label="Page navigation"><a class="verify-back" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg>Back to site</a></nav>
    </div></header>
    <main class="book-main plan-choice-main details-choice-main">
        <a class="book-back" href="/book/schedule/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 12H4m7-7-7 7 7 7"/></svg>Back</a>
        <div class="book-card details-content">
            <h1 class="book-title">Your details</h1>
            <p class="details-lead">We’ll use this information to send your booking confirmation and session link.</p>
            <form id="details-form" class="booking-form" novalidate>
                <div class="booking-field">
                    <label for="details-name">Full name</label>
                    <div class="details-input"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></svg><input type="text" id="details-name" autocomplete="name" placeholder="Enter your full name" aria-describedby="details-status" required></div>
                </div>
                <div class="booking-field">
                    <label for="details-email">Email address</label>
                    <div class="details-input"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="m3 6 9 7 9-7"/></svg><input type="email" id="details-email" autocomplete="email" inputmode="email" placeholder="Enter your email address" aria-describedby="details-status" required></div>
                </div>
                <div class="booking-field details-phone-field">
                    <label for="details-phone">Verified WhatsApp number</label>
                    <div class="details-input details-readonly"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20 11.5a8 8 0 0 1-12 7L3 20l1.5-5A8 8 0 1 1 20 11.5Z"/><path d="M8 7c-2 2 4 8 6 6l1-1-3-2-1 1-2-2 1-1-2-2Z" fill="currentColor" stroke="none"/></svg><input type="tel" id="details-phone" readonly aria-label="Verified WhatsApp number"></div>
                    <button type="button" id="details-change-number" class="details-change-number">Use a different number</button>
                </div>
                <div class="booking-honeypot" aria-hidden="true"><label for="details-hp">Leave this field blank</label><input type="text" id="details-hp" tabindex="-1" autocomplete="off"></div>
                <p id="details-status" class="booking-status" role="status"></p>
                <button type="submit" class="btn btn-primary details-review-button"><span>Review booking</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 12h16m-7-7 7 7-7 7"/></svg></button>
                <details class="details-extra"><summary>Notes and session details</summary><label for="details-notes">Notes for your therapist (optional)</label><textarea id="details-notes" rows="3" placeholder="Anything you’d like your therapist to know beforehand"></textarea><p id="details-when"></p></details>
            </form>
        </div>
    </main>
    <script src="/book/book.js?v=46"></script>
</body>
</html>
